<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Flip Buku</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#20232b;color:#eef0f5;
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* ---------- toolbar ---------- */
  #bar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:8px 12px;z-index:50;position:relative;
    background:rgba(12,14,19,.82);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  #title{font-weight:600;max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
  .sp{flex:1}
  button{
    font:inherit;color:inherit;cursor:pointer;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    padding:6px 12px;border-radius:8px;transition:background .15s;
  }
  button:hover:not(:disabled){background:rgba(255,255,255,.18)}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:#4c7dff;border-color:#4c7dff;color:#fff}
  button.primary:hover{background:#6490ff!important}
  #pageInput{
    width:58px;font:inherit;color:inherit;text-align:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:8px;padding:6px 4px;
  }
  #label{min-width:96px;text-align:center;opacity:.85;font-variant-numeric:tabular-nums}

  /* ---------- panggung ---------- */
  #stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:default}
  #stage.zoomed{cursor:grab}
  #stage.dragging{cursor:grabbing}
  #cam{position:absolute;inset:0;transform-origin:50% 50%}
  #cam.smooth{transition:transform .28s cubic-bezier(.2,.7,.2,1)}
  #shift{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #book{position:relative;flex:none}

  /* dinding plester (versi kalender) */
  body.mode-calendar #stage{
    background:
      radial-gradient(ellipse 65% 55% at 50% 36%,rgba(255,248,228,.62),rgba(255,248,228,0) 72%),
      radial-gradient(ellipse 125% 105% at 50% 48%,rgba(0,0,0,0) 52%,rgba(40,28,14,.42) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'><filter id='b' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .26  0 0 0 .55 -.12'/></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .30  0 0 0 0 .26  0 0 0 0 .2  0 0 0 .5 -.06'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      linear-gradient(180deg,#dcd6c8 0%,#c9c2b2 100%);
  }
  /* meja kayu (versi buku) */
  body.mode-book #stage{
    background:
      radial-gradient(ellipse 75% 65% at 50% 38%,rgba(255,226,170,.34),rgba(255,226,170,0) 72%),
      radial-gradient(ellipse 125% 105% at 50% 48%,rgba(0,0,0,0) 48%,rgba(10,5,0,.6) 100%),
      repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 138px,rgba(20,10,2,.55) 138px 140px,rgba(255,225,170,.12) 140px 142px),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='700'><filter id='w' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.003 .13' numOctaves='5' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .13  0 0 0 0 .065  0 0 0 0 .02  1.9 0 0 0 -.62'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
      linear-gradient(180deg,#a2713f,#84562f);
  }

  /* ---------- buku / kalender ---------- */
      .gut{position:absolute;z-index:400;pointer-events:none}
  .cast{position:absolute;z-index:500;pointer-events:none;opacity:0}
  .rings{position:absolute;z-index:300000;pointer-events:none}

  .gut.A,.gut.B{opacity:0}
  body.mode-book .gut.A{background:linear-gradient(to right,rgba(0,0,0,.34),rgba(0,0,0,.1) 40%,rgba(0,0,0,0))}
  body.mode-book .gut.B{background:linear-gradient(to left,rgba(0,0,0,.34),rgba(0,0,0,.1) 40%,rgba(0,0,0,0))}
  body.mode-calendar .gut.A{background:linear-gradient(to bottom,rgba(0,0,0,.26),rgba(0,0,0,.08) 40%,rgba(0,0,0,0))}
  body.mode-calendar .gut.B{background:linear-gradient(to top,rgba(0,0,0,.26),rgba(0,0,0,.08) 40%,rgba(0,0,0,0))}

  body.mode-calendar .castA{left:0;top:50%;width:100%;height:50%;background:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,0) 75%)}
  body.mode-calendar .castB{left:0;top:0;width:100%;height:50%;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0) 75%)}
  body.mode-book .castA{left:50%;top:0;width:50%;height:100%;background:linear-gradient(to right,rgba(0,0,0,.85),rgba(0,0,0,0) 75%)}
  body.mode-book .castB{left:0;top:0;width:50%;height:100%;background:linear-gradient(to left,rgba(0,0,0,.85),rgba(0,0,0,0) 75%)}

  .sheet{position:absolute;transform-style:preserve-3d}
  body.mode-calendar .sheet{left:0;top:50%;width:100%;height:50%;transform-origin:50% 0}
  body.mode-book .sheet{left:50%;top:0;width:50%;height:100%;transform-origin:0 50%}
  .seg{position:absolute;left:0;top:0;width:100%;height:100%;transform-style:preserve-3d}
  body.mode-calendar .seg{transform-origin:50% 0}
  body.mode-calendar .seg.n{top:100%}
  body.mode-book .seg{transform-origin:0 50%}
  body.mode-book .seg.n{left:100%}
  .piece{
    position:absolute;left:0;top:0;background:#fff;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  body.mode-calendar .piece{width:100%;height:var(--ov,calc(100% + 2px))}
  body.mode-book .piece{width:var(--ov,calc(100% + 2px));height:100%}
  body.mode-calendar .piece.back{transform:rotateX(180deg)}
  body.mode-book .piece.back{transform:rotateY(180deg)}
  .piece canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .shade{position:absolute;inset:0;pointer-events:none}
  /* lubang ring pada kertas kalender */
  .holes{
    position:absolute;left:0;right:0;top:0;pointer-events:none;
    height:calc(24px * var(--f,1));
    background:radial-gradient(circle at 50% calc(12px * var(--f,1)),
      #15110e 0,#15110e calc(3.2px * var(--f,1)),rgba(0,0,0,.38) calc(3.8px * var(--f,1)),rgba(0,0,0,0) calc(5px * var(--f,1)))
      0 0 / var(--pitch,40px) 100% repeat-x;
  }
  .holes.b{top:auto;bottom:0}

  /* ---------- kartu awal ---------- */
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  #empty .card{
    max-width:470px;text-align:center;padding:30px 28px;border-radius:18px;
    background:rgba(20,24,33,.86);border:1px dashed rgba(255,255,255,.3);
    box-shadow:0 20px 60px rgba(0,0,0,.55);color:#eef0f5;
  }
  #empty h1{margin:0 0 8px;font-size:22px}
  #empty p{margin:6px 0 16px;opacity:.78}
  #empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #empty small{display:block;margin-top:16px;opacity:.55}
  body.over #stage::after{
    content:"Lepas file PDF di sini";position:absolute;inset:14px;z-index:60;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;
    border:3px dashed #7aa2ff;border-radius:18px;background:rgba(76,125,255,.25);
  }
  #status{
    position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:.85;pointer-events:none;padding:0 70px;
  }

  /* ---------- tombol zoom mengambang ---------- */
  #zoomCtl{
    position:absolute;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;
    right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));
  }
  #zoomCtl button{
    width:46px;height:46px;padding:0;border-radius:50%;font-size:26px;line-height:1;
    display:grid;place-items:center;
    background:rgba(16,18,25,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  #zoomCtl button#zFit{font-size:18px}
  #zPct{
    font-size:11px;font-variant-numeric:tabular-nums;color:#fff;
    background:rgba(16,18,25,.82);padding:2px 9px;border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  @media (max-width:640px){
    #title{display:none}
    #bar{gap:6px;padding:6px 8px}
    button{padding:6px 9px}
  }
  #closeBtn{display:none}
  body.embedded #openBtn{display:none}
  body.embedded #closeBtn{display:inline-flex}
  body.embedded #title{max-width:24vw}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="title">PDF Flip – Buku</span>
    <span class="sp"></span>
    <button id="prevBtn" title="Halaman sebelumnya (← / ↑)">◀ Sebelumnya</button>
    <input id="pageInput" type="number" min="1" value="1" title="Lompat ke halaman">
    <span id="label">–</span>
    <button id="nextBtn" title="Halaman berikutnya (→ / ↓)">Berikutnya ▶</button>
    <span class="sp"></span>
    <button id="soundBtn" title="Suara balik halaman">🔊</button>
    <button id="fsBtn" title="Layar penuh">⛶</button>
    <button id="closeBtn" title="Tutup tampilan buku">✕</button>
    <button id="openBtn" class="primary">Buka PDF</button>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  </div>

  <div id="stage">
    <div id="cam"><div id="shift"><div id="book"></div></div></div>

    <div id="empty">
      <div class="card">
        <h1>PDF Flip – Buku</h1>
        <p>Tampilan buku: halaman kiri &amp; kanan dengan sampul dan ketebalan halaman. Lembar dibalik dari kanan ke kiri.</p>
        <div class="row">
          <button class="primary" id="openBtn2">Buka PDF</button>
          <button id="demoBtn">Coba contoh</button>
        </div>
        <small>Atau seret &amp; lepas file PDF ke sini</small>
      </div>
    </div>

    <div id="zoomCtl">
      <button id="zIn" title="Perbesar (+)" aria-label="Perbesar">+</button>
      <div id="zPct">100%</div>
      <button id="zOut" title="Perkecil (−)" aria-label="Perkecil">−</button>
      <button id="zFit" title="Ukuran pas (0)" aria-label="Ukuran pas">⤢</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script src="vendor/js/pdf.min.js"></script>
<script>
(() => {
  'use strict';
  const MODE = 'book';            // 'calendar' (atas-bawah) | 'book' (kiri-kanan)
  const V = MODE === 'calendar';
  document.body.classList.add(V ? 'mode-calendar' : 'mode-book');

  const $ = id => document.getElementById(id);
  const stage = $('stage'), cam = $('cam'), book = $('book');
  const prevBtn = $('prevBtn'), nextBtn = $('nextBtn'), pageInput = $('pageInput');
  const label = $('label'), titleEl = $('title'), statusEl = $('status'), emptyEl = $('empty');
  const fileInput = $('fileInput'), zPct = $('zPct');

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/js/pdf.worker.min.js';
  }
  const embedded = new URLSearchParams(location.search).has('embed');
  if (embedded) document.body.classList.add('embedded');
  const sendToApp = data => {
    if (embedded) parent.postMessage(data, location.origin);
  };
  $('closeBtn').onclick = () => sendToApp({ type: 'han-pustaka-book-close' });

  const SEG = 4, BEND = 26, EXTRA = 2, RAD = Math.PI / 180;
  const ZMIN = 0.5, ZMAX = 5;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let src = null, N = 0, S = 0, maxS = 0, s = 0;
  let ang = new Float32Array(0);
  const sheets = new Map(), fly = new Set(), anims = new Map();
  let PW = 0, PH = 0, along = 0, Wd = 0, Hd = 0, strip = 0, sizeKey = '';
  let shiftPx = 0, m = 8, tMax = 4, contentW = 0, contentH = 0;
  let zoom = 1, tx = 0, ty = 0, qual = 1;
  let els = {};
  let drag = null, rafId = 0;

  function mk(cls, parent) {
    const d = document.createElement('div');
    d.className = cls;
    if (parent) parent.appendChild(d);
    return d;
  }
  const place = (el, l, t, w, h) => {
    el.style.left = l + 'px'; el.style.top = t + 'px';
    el.style.width = w + 'px'; el.style.height = h + 'px';
  };

  /* ================= tata letak ================= */
  function calcRes() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let sc = dpr * qual;
    sc = Math.min(sc, Math.sqrt(3.4e6 / Math.max(1, PW * PH)), 4096 / Math.max(PW, PH, 1));
    sc = Math.max(sc, 0.5);
    if (V) {
      strip = Math.max(2, Math.round(PH * sc / SEG));
      Wd = Math.max(2, Math.round(PW * sc)); Hd = strip * SEG;
    } else {
      strip = Math.max(2, Math.round(PW * sc / SEG));
      Wd = strip * SEG; Hd = Math.max(2, Math.round(PH * sc));
    }
    sizeKey = Wd + 'x' + Hd;
    book.style.setProperty('--ov', ((strip + EXTRA) / strip * 100).toFixed(3) + '%');
  }

  function layout() {
    const r = stage.getBoundingClientRect();
    const ar = src ? src.aspect : 0.72;
    const pad = 14;
    const aw = Math.max(120, r.width - 2 * pad), ah = Math.max(120, r.height - 2 * pad);
    PH = V ? Math.min(ah / 2.14, (aw / 1.09) / ar) : Math.min(ah / 1.1, (aw / 2.22) / ar);
    PH = Math.max(60, Math.floor(PH));
    PW = Math.floor(PH * ar);
    along = V ? PH : PW;
    m = Math.max(5, Math.round(PW * 0.026));
    tMax = src ? clamp(2 + S * 0.12, 3, 14) : 4;

    book.style.width = (V ? PW : 2 * PW) + 'px';
    book.style.height = (V ? 2 * PH : PH) + 'px';
    book.style.perspective = (6 * along) + 'px';
    contentW = V ? PW + 2 * m : 2 * PW + 2 * m + 2 * tMax;
    contentH = V ? 2 * PH + 2 * m + 2 * tMax : PH + 2 * m + 0.5 * tMax;

    if (els.gutA) {
      const g = Math.round(PW * 0.07);
      place(els.gutA, PW, 0, g, PH);
      place(els.gutB, PW - g, 0, g, PH);
    }
    calcRes();
    clampPan(); applyCam();
  }

  function buildRings() {
    if (!V || !els.rings) return;
    const f = clamp(PW / 520, 0.8, 1.5);
    const n = Math.max(4, Math.round(PW / (34 * f)));
    const pitch = PW / n, H = 36 * f;
    book.style.setProperty('--pitch', pitch + 'px');
    book.style.setProperty('--f', f);
    let h = '<defs><linearGradient id="mg" x1="0" x2="1" y1="0" y2="0">' +
      '<stop offset="0" stop-color="#5e626a"/><stop offset=".32" stop-color="#f6f8fb"/>' +
      '<stop offset=".62" stop-color="#9aa0a9"/><stop offset="1" stop-color="#454950"/></linearGradient>' +
      '<filter id="rs" x="-80%" y="-20%" width="260%" height="150%">' +
      '<feDropShadow dx="1.6" dy="2.6" stdDeviation="1.7" flood-color="#000" flood-opacity=".55"/></filter></defs>';
    for (let j = 0; j < n; j++) {
      const cx = pitch * (j + 0.5);
      h += '<rect x="' + (cx - 4.6 * f) + '" y="' + (2 * f) + '" width="' + (9.2 * f) + '" height="' + (H - 4 * f) +
        '" rx="' + (4.6 * f) + '" fill="none" stroke="url(#mg)" stroke-width="' + (2.7 * f) + '" filter="url(#rs)"/>';
    }
    els.rings.style.left = '0px';
    els.rings.style.top = (PH - H / 2) + 'px';
    els.rings.style.width = PW + 'px';
    els.rings.style.height = H + 'px';
    els.rings.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + PW + '" height="' + H +
      '" viewBox="0 0 ' + PW + ' ' + H + '" style="overflow:visible;display:block">' + h + '</svg>';
  }

  /* ================= lembar ================= */
  function ensureSheet(k) {
    let sh = sheets.get(k);
    if (sh) return sh;
    const el = mk('sheet', book);
    const segs = [], front = [], back = [];
    let parent = el;
    for (let i = 0; i < SEG; i++) {
      const seg = mk('seg' + (i ? ' n' : ''), parent);
      if (i === 0) { if (V) seg.style.height = (100 / SEG) + '%'; else seg.style.width = (100 / SEG) + '%'; }
      const pf = mk('piece front', seg), pb = mk('piece back', seg);
      const cf = document.createElement('canvas'), cb = document.createElement('canvas');
      pf.appendChild(cf); pb.appendChild(cb);
      const fs = mk('shade', pf), bs = mk('shade', pb);
      if (i === 0 && V) { mk('holes', pf); mk('holes b', pb); }
      segs.push({ el: seg, fs, bs });
      front.push(cf); back.push(cb);
      parent = seg;
    }
    sh = { el, segs, front, back, kf: null, kb: null, key: '' };
    sheets.set(k, sh);
    apply(k);
    return sh;
  }
  function freeSheet(k) {
    const sh = sheets.get(k);
    if (!sh) return;
    sh.el.remove(); sheets.delete(k);
  }

  const gF = V ? 'to bottom' : 'to right', gB = V ? 'to top' : 'to left';
  function apply(k) {
    const a = ang[k];
    const flying = a > 0.05 && a < 179.95;
    if (flying) fly.add(k); else fly.delete(k);
    const sh = sheets.get(k);
    if (!sh) return;
    const T = flying ? BEND * Math.sin(a * RAD) : 0;
    const c = T / (SEG - 1);
    let z;
    if (flying) z = 100000 + (a >= 90 ? k : -k);
    else z = k < s ? 100 - (s - 1 - k) : 100 - (k - s);
    const key = a.toFixed(2) + '|' + z;
    if (key === sh.key) return;
    sh.key = key;
    sh.el.style.transform = V ? 'rotateX(' + a + 'deg)' : 'rotateY(' + (-a) + 'deg)';
    sh.el.style.zIndex = z;
    for (let i = 0; i < SEG; i++) {
      const sg = sh.segs[i];
      if (i > 0) sg.el.style.transform = V ? 'rotateX(' + c + 'deg)' : 'rotateY(' + (-c) + 'deg)';
      const th = a + i * c;
      const fd = th <= 90 ? 0.5 * Math.pow(Math.max(0, th) / 90, 1.3) : 0.5;
      const bd = th >= 90 ? 0.5 * Math.pow(Math.max(0, 180 - th) / 90, 1.3) : 0.5;
      sg.fs.style.background = (i === 0 ? 'linear-gradient(' + gF + ',rgba(0,0,0,.2),rgba(0,0,0,0) 60%),' : '') +
        'rgba(0,0,0,' + fd.toFixed(3) + ')';
      sg.bs.style.background = (i === 0 ? 'linear-gradient(' + gB + ',rgba(0,0,0,.2),rgba(0,0,0,0) 60%),' : '') +
        'rgba(0,0,0,' + bd.toFixed(3) + ')';
    }
  }

  function updateGlobal() {
    if (!S || !els.gutA) return;
    let sum = 0;
    for (let k = 0; k < S; k++) sum += ang[k];
    const flipped = sum / 180, a0 = ang[0], aL = ang[S - 1];
    shiftPx = -(along / 2) * (1 - a0 / 180) + (along / 2) * (aL / 180);
    $('shift').style.transform = 'translateX(' + shiftPx.toFixed(2) + 'px)';
    const opB = clamp(a0 / 45, 0, 1), opA = clamp((180 - aL) / 45, 0, 1);
    els.gutA.style.opacity = opA; els.gutB.style.opacity = opB;
    let cl = 0, cu = 0;
    for (const k of fly) {
      const a = ang[k], sn = Math.sin(a * RAD);
      if (k + 1 < S) cl = Math.max(cl, 0.5 * sn * clamp((135 - a) / 45, 0, 1));
      if (k >= 1) cu = Math.max(cu, 0.5 * sn * clamp((a - 45) / 45, 0, 1));
    }
    els.castA.style.opacity = cl.toFixed(3);
    els.castB.style.opacity = cu.toFixed(3);
  }
  function refreshWindow() {
    if (!S) return;
    const R = qual > 1 ? 2 : 3;
    const lo = Math.max(0, s - R), hi = Math.min(S - 1, s + R);
    for (let k = lo; k <= hi; k++) ensureSheet(k);
    for (const [k, sh] of Array.from(sheets)) {
      const inWin = k >= lo && k <= hi, flying = fly.has(k);
      sh.el.style.display = (inWin || flying) ? '' : 'none';
      if (!inWin && !flying) { freeSheet(k); continue; }
      sh.key = '';
      apply(k);
    }
    updateGlobal();
    refreshQueue();
  }

  /* ================= render halaman (antrian) ================= */
  const OFF = document.createElement('canvas');
  let queue = [], pumping = false, curTask = null, epoch = 0;
  function refreshQueue() {
    queue = [];
    const b = 2 * s;
    [b + 1, b, b + 2, b + 3, b - 1, b - 2, b + 4, b + 5, b - 3, b - 4].forEach(p => {
      if (p >= 1 && p <= N) queue.push(p);
    });

  async function openPdf(data, name, initialPage = 1) {

    }
    statusEl.textContent = 'Memuat PDF...';
    try {
      const task = pdfjsLib.getDocument(typeof data === 'string' ? { url: data } : { data });
      task.onPassword = (cb, reason) => {
        const pw = prompt(reason === 2 ? 'Password salah, coba lagi:' : 'PDF ini dilindungi password:');
        if (pw === null) task.destroy(); else cb(pw);
      };
      const doc = await task.promise;
      const p1 = await doc.getPage(1);
      const vp = p1.getViewport({ scale: 1 });
      start({
        n: doc.numPages,
        aspect: vp.width / vp.height,
        name,
        render(p, canvas, W, H) {
          let cancelled = false, rt = null;
          const promise = (async () => {
            const page = await doc.getPage(p);
            if (cancelled) throw new Error('cancelled');
            const v1 = page.getViewport({ scale: 1 });
            const sc = Math.min(W / v1.width, H / v1.height);
            const v = page.getViewport({ scale: sc });

              transform: [1, 0, 0, 1, (W - v.width) / 2, (H - v.height) / 2] });
            await rt.promise;
          })();
          return { promise, cancel() { cancelled = true; if (rt) rt.cancel(); } };
        }
      }, initialPage);
    } catch (err) {
      if (err && err.name === 'PasswordException') return;
      statusEl.textContent = '';
      sendToApp({ type: 'han-pustaka-book-error', message: err && err.message ? err.message : String(err) });
      alert('Gagal membuka PDF: ' + (err && err.message ? err.message : err));
    }
  }

  const demoSource = () => V ? calendarDemo() : bookDemo();

  /* ================= tombol & drag-drop ================= */
  $('openBtn').onclick = $('openBtn2').onclick = () => fileInput.click();
  fileInput.onchange = () => { openFile(fileInput.files[0]); fileInput.value = ''; };
  $('demoBtn').onclick = () => start(demoSource());
  ['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'drop' || !e.relatedTarget) document.body.classList.remove('over');
  }));
  window.addEventListener('drop', e => {
    document.body.classList.remove('over');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });

  let rsT = 0;
  window.addEventListener('resize', () => {
    layout();
    clearTimeout(rsT);
    rsT = setTimeout(() => { if (src) { invalidateRender(); refreshQueue(); } }, 160);
  });

  layout();
  updateUI();
  applyCam();

  // API kecil (berguna untuk embed / pengujian)
  window.flipViewer = { next, prev, goTo, zoomIn: () => setZoom(zoom * 1.3, 0, 0, true),
    zoomOut: () => setZoom(zoom / 1.3, 0, 0, true), setZoom: (z) => setZoom(z, 0, 0, false),
    demo: () => start(demoSource()), openPdf, get state() { return { s, N, zoom, tx, ty, qual }; } };

  const q = new URLSearchParams(location.search);
  if (embedded) {
    emptyEl.style.display = 'none';
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== parent) return;
      if (event.data?.type === 'han-pustaka-open-book') {
        titleEl.textContent = event.data.name || 'Dokumen';
        openPdf(new Uint8Array(event.data.data), event.data.name || 'Dokumen', event.data.lastPage || 1);
      } else if (event.data?.type === 'han-pustaka-book-key') {
        handleKey(event.data.key);
      }
    });
  } else if (q.get('file')) openPdf(q.get('file'), q.get('file').split('/').pop());
  else if (q.has('demo')) start(demoSource());
})();
</script>
</body>
</html>
